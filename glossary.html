<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Guide Glossary</title>
<link rel="stylesheet" href="style.css">
<style>
  .tools { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); padding-block: 12px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
  .search { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; max-width: 420px; }
  .search input { border: 0; background: transparent; color: var(--ink); font: 1rem var(--font-body); width: 100%; outline: none; }
  .search:focus-within { outline: 3px solid var(--cobalt); outline-offset: 2px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: space-between; }
  .letters { display: flex; flex-wrap: wrap; gap: 2px; }
  .letters a, .letters span { font: 600 0.82rem var(--font-code); font-variation-settings: "MONO" 1; width: 24px; height: 26px; display: grid; place-items: center; border-radius: 4px; text-decoration: none; }
  .letters a:hover { background: var(--cobalt-soft); }
  .letters span { color: var(--line); }
  .count { font: 600 0.85rem var(--font-code); font-variation-settings: "MONO" 1; color: var(--muted); }
  .group { display: grid; grid-template-columns: 56px 1fr; gap: 16px; padding-block: 22px; border-bottom: 1px solid var(--line); scroll-margin-top: 150px; }
  @media (max-width: 560px) { .group { grid-template-columns: 1fr; gap: 6px; } }
  .group > h2 { font-size: 2rem; color: var(--cobalt); }
  dl { margin: 0; display: grid; gap: 16px; }
  .entry { display: grid; gap: 4px; }
  dt { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; font: 700 1.1rem var(--font-display); }
  dt .cat { font: 600 0.68rem var(--font-code); font-variation-settings: "MONO" 1; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: var(--stage); color: var(--muted); }
  dt .cat.html { color: var(--prop); } dt .cat.css { color: var(--cobalt); } dt .cat.layout { color: var(--val); } dt .cat.js { color: var(--fn); }
  .entry { scroll-margin-top: 170px; border-radius: 8px; }
  .entry:target { outline: 3px solid var(--cobalt); outline-offset: 6px; background: var(--cobalt-soft); }
  dd { margin: 0; display: grid; gap: 4px; max-width: 70ch; }
  dd .ex { font-size: 0.9rem; color: var(--muted); }
  dd .more { font-size: 0.9rem; }
  mark { background: color-mix(in srgb, var(--prop) 25%, transparent); color: inherit; border-radius: 2px; }
  .empty { padding-block: 24px; color: var(--muted); }
</style>
<script src="book.js"></script>
<script src="js/progress.js"></script>
<script src="js/chrome.js"></script>
<script src="js/quiz.js"></script>
</head>
<body>
<main class="wrap">
  <a class="crumb" href="index.html">← Field Guide</a>
  <header class="page-head">
    <h1>Glossary</h1>
    <p class="lede">Plain-language definitions of the words used across the Field Guide. Each one links to the page that teaches it.</p>
  </header>

  <div class="tools">
    <div class="row">
      <label class="search" for="q"><span class="mono" aria-hidden="true" style="color:var(--muted)">/</span><input id="q" type="search" placeholder="Search terms and definitions"></label>
      <div class="seg" id="cats" role="group" aria-label="Category"></div>
    </div>
    <div class="row"><nav class="letters" id="letters" aria-label="Jump to letter"></nav><span class="count" id="count"></span></div>
  </div>

  <div id="list"></div>
  <p class="empty" id="empty" hidden>No terms match. Try a shorter word, or switch the category back to All.</p>

  <footer class="page-foot"><a href="index.html">← All topics</a><span class="mono">Missing a term? Ask your instructor.</span></footer>
</main>

<script src="glossary-terms.js"></script>
<script>
  // [term, category, definition, example (optional), page (optional)]
  const T = [...window.GLOSSARY];
  const TITLES = Object.fromEntries(BOOK.lessons.map((l) => [l.href, l.title]));
  const CATS = { all: "All", html: "HTML", css: "CSS", layout: "Layout", js: "JS", workflow: "Workflow" };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const letterOf = (t) => { const c = t.replace(/^[^a-z]+/i, "")[0].toUpperCase(); return c; };
  T.sort((a, b) => a[0].replace(/^[^a-z]+/i, "").localeCompare(b[0].replace(/^[^a-z]+/i, ""), "en", { sensitivity: "base" }));
  let cat = "all";
  $("cats").innerHTML = Object.entries(CATS).map(([k, v]) => `<button class="btn" data-c="${k}">${v}</button>`).join("");
  $("cats").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { cat = b.dataset.c; render(); } });
  // Highlight matches in the raw text, escaping each piece, so entities never get split.
  function hi(text, q) {
    if (!q) return esc(text);
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    let out = "", last = 0;
    text.replace(re, (m, idx) => { out += esc(text.slice(last, idx)) + "<mark>" + esc(m) + "</mark>"; last = idx + m.length; return m; });
    return out + esc(text.slice(last));
  }
  function render() {
    const q = $("q").value.trim();
    const ql = q.toLowerCase();
    const items = T.filter(([t, c, d, ex]) => (cat === "all" || c === cat) && (!ql || (t + " " + d + " " + ex).toLowerCase().includes(ql)));
    const groups = {};
    items.forEach((it) => (groups[letterOf(it[0])] = groups[letterOf(it[0])] || []).push(it));
    $("list").innerHTML = Object.keys(groups).sort().map((L) => `<section class="group" id="letter-${L}"><h2>${L}</h2><dl>${groups[L].map(([t, c, d, ex, page]) =>
      `<div class="entry" id="${glossaryId(t)}"><dt>${hi(t, q)}<span class="cat ${c}">${CATS[c]}</span></dt><dd><span>${hi(d, q)}</span>${ex ? `<code class="ex">${hi(ex, q)}</code>` : ""}${page ? `<a class="more" href="${page}">Learn more: ${esc(TITLES[page])} →</a>` : ""}</dd></div>`).join("")}</dl></section>`).join("");
    $("letters").innerHTML = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map((L) => groups[L] ? `<a href="#letter-${L}">${L}</a>` : `<span aria-hidden="true">${L}</span>`).join("");
    $("count").textContent = `${items.length} of ${T.length} terms`;
    $("empty").hidden = items.length > 0;
    document.querySelectorAll("#cats .btn").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.c === cat)));
  }
  $("q").addEventListener("input", render);
  document.addEventListener("keydown", (e) => { if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); } });
  render();
</script>
</body>
</html>
