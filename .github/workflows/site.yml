# Checks every push and pull request with scripts/check.mjs, then publishes main to GitHub Pages
# with a freshly built search index.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check.mjs

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Rebuild the search index from the lessons being published, so nobody has to remember to.
      - run: node scripts/check.mjs --write
      # Publish only the site itself, not the repo tooling.
      - run: rsync -a --exclude '.*' --exclude scripts --exclude '*.md' ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
